<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wizer — barcha havolalar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#161c24;
    --bg-2:#232d3a;
    --card:#1a212a;
    --card-border:rgba(255,255,255,0.07);
    --accent:#e0a877;
    --accent-soft:rgba(224,168,119,0.16);
    --text:#f4efe9;
    --text-dim:#9aa4ae;
    --btn:#212a35;
    --btn-hover:#2b3644;
  }

  *{ box-sizing:border-box; }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @keyframes iconGlow{
    0%,100%{ box-shadow:0 0 6px rgba(255,255,255,0.25); background:rgba(255,255,255,0.10); }
    50%{ box-shadow:0 0 18px rgba(255,255,255,0.55); background:rgba(255,255,255,0.22); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; }
  }

  body{
    margin:0;
    min-height:100vh;
    font-family:'Inter','Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background:
      radial-gradient(circle at 25% 10%, rgba(160,180,200,0.10), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(45,60,80,0.30), transparent 50%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    color:var(--text);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:48px 16px;
    position:relative;
    overflow-x:hidden;
  }

  .card{
    width:100%;
    max-width:420px;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--card-border);
    border-radius:28px;
    padding:32px 28px 40px;
    backdrop-filter:blur(14px);
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
    position:relative;
    z-index:1;
  }

  .top-row{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    margin-bottom:8px;
  }

  .share-btn{
    width:36px;height:36px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    border:none;
    color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .2s ease;
  }
  .share-btn:hover{ background:rgba(255,255,255,0.12); color:var(--text); }

  .avatar-wrap{
    position:relative;
    width:104px;
    margin:18px auto 18px;
  }

  .avatar{
    width:104px;height:104px;
    border-radius:50%;
    display:block;
    object-fit:cover;
    border:none;
    position:relative;
    z-index:1;
  }

  h1{
    text-align:center;
    font-size:22px;
    font-weight:700;
    margin:0 0 8px;
    letter-spacing:0.2px;
    color:#ffffff;
  }

  .bio{
    text-align:center;
    color:var(--text-dim);
    font-size:14.5px;
    line-height:1.5;
    margin:0 0 22px;
    padding:0 8px;
  }

  .socials{
    display:flex;
    justify-content:center;
    gap:16px;
    margin-bottom:26px;
  }

  .socials a{
    width:38px;height:38px;
    border-radius:50%;
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    color:var(--text);
    text-decoration:none;
    transition:transform .2s ease, color .2s ease;
  }
  .socials a:hover{
    transform:translateY(-3px) scale(1.06);
    color:#ffffff;
    animation:iconGlow 1.3s ease-in-out infinite;
  }
  .socials svg{ width:18px; height:18px; }

  .links{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link-btn{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--btn);
    border-radius:16px;
    padding:16px 18px;
    text-decoration:none;
    color:var(--text);
    font-weight:600;
    font-size:15px;
    transition:background .18s ease, transform .18s ease, box-shadow .18s ease;
    border:1px solid transparent;
    position:relative;
  }
  .link-btn:hover{
    background:var(--btn-hover);
    transform:translateY(-3px) scale(1.06);
    border-color:rgba(255,255,255,0.25);
    box-shadow:0 8px 20px rgba(0,0,0,0.25), 0 0 16px rgba(255,255,255,0.12);
  }
  .link-btn:hover .link-icon{
    animation:iconGlow 1.3s ease-in-out infinite;
  }

  .link-icon{
    width:34px;height:34px;
    border-radius:10px;
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .link-icon svg{ width:18px; height:18px; }

  .link-label{ flex:1; text-align:center; margin-right:34px; }

  .reveal{
    opacity:0;
    animation:fadeUp 0.6s ease forwards;
  }
  .reveal-1{ animation-delay:0.05s; }
  .reveal-2{ animation-delay:0.15s; }
  .reveal-3{ animation-delay:0.25s; }
  .reveal-4{ animation-delay:0.35s; }
  .reveal-5{ animation-delay:0.45s; }
  .reveal-6{ animation-delay:0.53s; }
  .reveal-7{ animation-delay:0.61s; }

  footer{
    text-align:center;
    margin-top:34px;
    color:var(--text-dim);
    font-size:12px;
    opacity:0.6;
  }

  @media (max-width:420px){
    .card{ padding:26px 18px 32px; border-radius:22px; }
  }
</style>
</head>
