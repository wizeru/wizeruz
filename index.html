<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wizer — barcha havolalar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg-1:#161c24;
  --bg-2:#232d3a;
  --card:#1a212a;
  --card-border:rgba(255,255,255,0.07);
  --accent:#e0a877;
  --accent-soft:rgba(224,168,119,0.16);
  --text:#f4efe9;
  --text-dim:#9aa4ae;
  --btn:#212a35;
  --btn-hover:#2b3644;
}

*{
  box-sizing:border-box;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(14px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes iconGlow{
  0%,100%{
    box-shadow:0 0 6px rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.10);
  }

  50%{
    box-shadow:0 0 18px rgba(255,255,255,0.55);
    background:rgba(255,255,255,0.22);
  }
}

@media (prefers-reduced-motion: reduce){
  *{
    animation:none !important;
  }
}

body{
  margin:0;
  min-height:100vh;

  font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;

  background:
    radial-gradient(
      circle at 25% 10%,
      rgba(160,180,200,0.10),
      transparent 45%
    ),

    radial-gradient(
      circle at 85% 85%,
      rgba(45,60,80,0.30),
      transparent 50%
    ),

    linear-gradient(
      160deg,
      var(--bg-1),
      var(--bg-2)
    );

  color:var(--text);

  display:flex;
  justify-content:center;
  align-items:flex-start;

  padding:24px 16px 32px;

  position:relative;
  overflow-x:hidden;
}

.card{
  width:100%;
  max-width:560px;

  background:rgba(255,255,255,0.03);

  border:1px solid var(--card-border);
  border-radius:34px;

  padding:34px 38px 40px;

  backdrop-filter:blur(14px);

  box-shadow:
    0 20px 60px rgba(0,0,0,0.35);

  position:relative;
  z-index:1;
}

.top-row{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  margin-bottom:8px;
}

.share-btn{
  width:42px;
  height:42px;

  border-radius:50%;

  background:rgba(255,255,255,0.06);

  border:none;

  color:var(--text-dim);

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  transition:
    background .2s ease,
    transform .2s ease;
}

.share-btn:hover{
  background:rgba(255,255,255,0.12);
  color:var(--text);
  transform:scale(1.08);
}

.avatar-wrap{
  position:relative;

  width:136px;

  margin:10px auto 14px;
}

.avatar{
  width:136px;
  height:136px;

  border-radius:50%;

  display:block;

  object-fit:cover;

  border:none;

  position:relative;
  z-index:1;
}

h1{
  text-align:center;

  font-size:30px;

  font-weight:700;

  margin:0 0 8px;

  letter-spacing:0.2px;

  color:#ffffff;
}

.bio{
  text-align:center;

  color:var(--text-dim);

  font-size:17px;

  line-height:1.4;

  margin:0 0 18px;

  padding:0 8px;
}

.socials{
  display:flex;

  justify-content:center;

  gap:14px;

  margin-bottom:20px;
}

.socials a{
  width:46px;
  height:46px;

  border-radius:50%;

  background:transparent;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--text);

  text-decoration:none;

  transition:
    transform .2s ease,
    color .2s ease;
}

.socials a:hover{
  transform:translateY(-3px) scale(1.025);

  color:#ffffff;

  animation:iconGlow 1.3s ease-in-out infinite;
}

.socials svg{
  width:20px;
  height:20px;
}

.links{
  display:flex;

  flex-direction:column;

  gap:14px;
}

.link-btn{
  display:flex;

  align-items:center;

  gap:14px;

  background:var(--btn);

  border-radius:20px;

  padding:17px 22px;

  text-decoration:none;

  color:var(--text);

  font-weight:600;

  font-size:17px;

  transition:
    background .22s ease,
    transform .22s ease,
    box-shadow .22s ease,
    border-color .22s ease;

  border:1px solid transparent;

  position:relative;
}

.link-btn:hover{
  background:var(--btn-hover);

  transform:translateY(-3px) scale(1.025);

  border-color:rgba(255,255,255,0.25);

  box-shadow:
    0 10px 24px rgba(0,0,0,0.28),
    0 0 16px rgba(255,255,255,0.10);
}

.link-btn:hover .link-icon{
  animation:iconGlow 1.3s ease-in-out infinite;
}

.link-icon{
  width:44px;
  height:44px;

  border-radius:13px;

  background:transparent;

  display:flex;

  align-items:center;
  justify-content:center;

  flex-shrink:0;
}

.link-icon svg{
  width:20px;
  height:20px;
}

.link-label{
  flex:1;

  text-align:center;

  margin-right:44px;
}

.reveal{
  opacity:0;

  animation:
    fadeUp 0.6s ease forwards;
}

.reveal-1{
  animation-delay:0.05s;
}

.reveal-2{
  animation-delay:0.15s;
}

.reveal-3{
  animation-delay:0.25s;
}

.reveal-4{
  animation-delay:0.35s;
}

.reveal-5{
  animation-delay:0.45s;
}

.reveal-6{
  animation-delay:0.53s;
}

.reveal-7{
  animation-delay:0.61s;
}

footer{
  text-align:center;

  margin-top:24px;

  color:var(--text-dim);

  font-size:12px;

  opacity:0.6;
}

@media (max-width:600px){

  body{
    padding:14px 10px 20px;
  }

  .card{
    max-width:100%;

    padding:26px 20px 30px;

    border-radius:28px;
  }

  .avatar-wrap{
    width:120px;

    margin:6px auto 12px;
  }

  .avatar{
    width:120px;
    height:120px;
  }

  h1{
    font-size:26px;
  }

  .bio{
    font-size:15px;
  }

  .link-btn{
    padding:15px 18px;

    font-size:16px;
  }

  .link-icon{
    width:40px;
    height:40px;
  }

  .link-label{
    margin-right:40px;
  }
}
</style>
</head>

<body>

<div class="card">

  <!-- Profil rasmi -->
  <div class="avatar-wrap reveal reveal-1">
    <img
      class="avatar"
      src="YOUR_IMAGE_URL"
      alt="Profile photo"
    >
  </div>

  <!-- Ism -->
  <h1 class="reveal reveal-2">
    Sizning ismingiz
  </h1>

  <!-- Bio -->
  <p class="bio reveal reveal-3">
    Sizning qisqa bio matningiz shu yerda bo‘ladi.
  </p>

  <!-- Ijtimoiy tarmoqlar -->
  <div class="socials reveal reveal-4">

    <a href="#" aria-label="Instagram">
      Instagram
    </a>

    <a href="#" aria-label="Telegram">
      Telegram
    </a>

    <a href="#" aria-label="YouTube">
      YouTube
    </a>

  </div>

  <!-- Linklar -->
  <div class="links">

    <a href="#" class="link-btn reveal reveal-5">
      <div class="link-icon">🔗</div>
      <div class="link-label">
        Mening asosiy havolam
      </div>
    </a>

    <a href="#" class="link-btn reveal reveal-6">
      <div class="link-icon">📱</div>
      <div class="link-label">
        Instagram
      </div>
    </a>

    <a href="#" class="link-btn reveal reveal-7">
      <div class="link-icon">▶</div>
      <div class="link-label">
        YouTube
      </div>
    </a>

  </div>

  <footer>
    © 2026
  </footer>

</div>

</body>
</html>
