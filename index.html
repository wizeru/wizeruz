<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wizer — barcha havolalar</title>

<style>

*{
  box-sizing:border-box;
}

:root{
  --bg1:#161c24;
  --bg2:#232d3a;
  --card:#1a212a;
  --button:#212a35;
  --button-hover:#2b3644;
  --text:#f4efe9;
  --muted:#9aa4ae;
}

body{

  margin:0;

  min-height:100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:var(--text);

  display:flex;

  justify-content:center;

  align-items:flex-start;

  padding:24px 16px 32px;

  background:

    radial-gradient(
      circle at 25% 10%,
      rgba(160,180,200,0.10),
      transparent 45%
    ),

    radial-gradient(
      circle at 85% 85%,
      rgba(45,60,80,0.30),
      transparent 50%
    ),

    linear-gradient(
      160deg,
      var(--bg1),
      var(--bg2)
    );

}

.card{

  width:100%;

  max-width:560px;

  padding:34px 38px 40px;

  background:rgba(255,255,255,0.04);

  border:1px solid rgba(255,255,255,0.08);

  border-radius:34px;

  box-shadow:
    0 20px 60px rgba(0,0,0,0.35);

  backdrop-filter:blur(14px);

}

.avatar{

  display:block;

  width:136px;

  height:136px;

  margin:10px auto 16px;

  object-fit:cover;

  border-radius:50%;

}

h1{

  margin:0 0 10px;

  text-align:center;

  font-size:30px;

  font-weight:700;

}

.bio{

  margin:0 auto 22px;

  max-width:440px;

  text-align:center;

  color:var(--muted);

  font-size:17px;

  line-height:1.5;

}

.socials{

  display:flex;

  justify-content:center;

  gap:22px;

  margin-bottom:24px;

}

.socials a{

  display:flex;

  align-items:center;

  justify-content:center;

  width:46px;

  height:46px;

  color:white;

  text-decoration:none;

  font-size:24px;

  border-radius:50%;

  transition:0.25s;

}

.socials a:hover{

  transform:translateY(-4px) scale(1.08);

  background:rgba(255,255,255,0.12);

}

.links{

  display:flex;

  flex-direction:column;

  gap:16px;

}

.link{

  display:flex;

  align-items:center;

  gap:16px;

  width:100%;

  min-height:72px;

  padding:14px 20px;

  color:var(--text);

  background:var(--button);

  border:1px solid transparent;

  border-radius:20px;

  text-decoration:none;

  transition:0.25s;

}

.link:hover{

  background:var(--button-hover);

  transform:translateY(-3px);

  border-color:rgba(255,255,255,0.18);

  box-shadow:
    0 10px 25px rgba(0,0,0,0.25);

}

.icon{

  display:flex;

  align-items:center;

  justify-content:center;

  width:44px;

  height:44px;

  flex-shrink:0;

  font-size:22px;

}

.link-text{

  flex:1;

  text-align:center;

  margin-right:44px;

  font-size:18px;

  font-weight:600;

}

footer{

  margin-top:26px;

  text-align:center;

  color:var(--muted);

  font-size:13px;

}

@media(max-width:600px){

  body{

    padding:12px 10px 20px;

  }

  .card{

    padding:26px 18px 30px;

    border-radius:28px;

  }

  .avatar{

    width:120px;

    height:120px;

  }

  h1{

    font-size:26px;

  }

  .bio{

    font-size:15px;

  }

  .link{

    min-height:64px;

    padding:12px 16px;

  }

  .link-text{

    font-size:16px;

    margin-right:40px;

  }

}

</style>

</head>

<body>

<div class="card">

  <!-- PROFIL RASMI -->
  <img
    class="avatar"
    src="https://i.imgur.com/REPLACE.jpg"
    alt="Wizer"
  >


  <!-- ISM -->
  <h1>
    Wizer
  </h1>


  <!-- BIO -->
  <p class="bio">
    Barcha rasmiy ijtimoiy tarmoqlarimni shu yerda topishingiz mumkin.
  </p>


  <!-- IJTIMOIY TARMOQLAR -->
  <div class="socials">

    <a
      href="https://instagram.com/"
      target="_blank"
      title="Instagram"
    >
      📸
    </a>

    <a
      href="https://youtube.com/"
      target="_blank"
      title="YouTube"
    >
      ▶️
    </a>

    <a
      href="https://t.me/"
      target="_blank"
      title="Telegram"
    >
      ✈️
    </a>

  </div>


  <!-- ASOSIY LINK -->

  <div class="links">

    <a
      class="link"
      href="https://youtube.com/"
      target="_blank"
    >

      <div class="icon">
        ▶️
      </div>

      <div class="link-text">
        YouTube
      </div>

    </a>


    <!-- TELEGRAM -->

    <a
      class="link"
      href="https://t.me/"
      target="_blank"
    >

      <div class="icon">
        ✈️
      </div>

      <div class="link-text">
        Telegram
      </div>

    </a>


    <!-- INSTAGRAM -->

    <a
      class="link"
      href="https://instagram.com/"
      target="_blank"
    >

      <div class="icon">
        📸
      </div>

      <div class="link-text">
        Instagram
      </div>

    </a>

  </div>


  <footer>
    © 2026 Wizer
  </footer>

</div>

</body>

</html>
